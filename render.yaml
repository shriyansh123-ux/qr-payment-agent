# Single Docker web service: React UI and FastAPI API on one origin.
# The service name is kept from the original project so the hosted URL stays the same.
services:
  - type: web
    name: qr-payment-agent-demo
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: QR_API_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: QR_PUBLIC_DEMO
        value: "true"
      - key: QR_TRUSTED_PROXY_HOPS
        value: "1"
