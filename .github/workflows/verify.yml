name: Verify Travel QR Cost Estimator

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check src tests integration
      - name: Type-check Python
        run: mypy
      - name: Execute all Python tests, including real QR image decoding
        env:
          QR_API_KEY: "a-ci-only-key-with-no-production-access-1234"
        run: python -m pytest tests/ -q
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: accounts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d accounts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Run account tests against PostgreSQL
        env:
          QR_TEST_POSTGRES_URL: "postgresql://ci:ci-only-password@127.0.0.1:5432/accounts"
        run: python -m pytest tests/test_account_storage.py -q -rs
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked JS dependencies
        run: npm ci
      - name: Build React frontend
        run: npm run build
      - name: Test cash arithmetic, money formatting and demo-payload rules
        run: npm test
      - name: Lint React frontend
        run: npm run lint
      - name: Report npm dependency advisories
        run: |
          npm audit --json > /tmp/qr-npm-audit.json || true
          node - <<'JS'
          const fs = require("fs");
          const audit = JSON.parse(fs.readFileSync("/tmp/qr-npm-audit.json", "utf-8"));
          console.log("Dependency audit totals:", JSON.stringify(audit.metadata?.vulnerabilities || {}));
          for (const [name, vulnerability] of Object.entries(audit.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name,
              severity: vulnerability.severity,
              isDirect: vulnerability.isDirect,
              range: vulnerability.range,
              fixAvailable: vulnerability.fixAvailable,
              via: (vulnerability.via || []).map(v => typeof v === "string" ? v : ({title: v.title, url: v.url, range: v.range}))
            }));
          }
          JS
      - name: Enforce no known npm advisories
        run: npm audit --audit-level=low
  live_fx:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install requests==2.32.5
      - name: Validate real JPY/INR and INR/USD reference conversions
        run: |
          python - <<'PY'
          import requests
          from src.services.fx import FXRateService
          session = requests.Session()
          try:
              for pair in [("JPY", "INR"), ("INR", "USD")]:
                  base, quote = pair
                  primary = session.get(f"https://api.frankfurter.dev/v2/rate/{base}/{quote}", timeout=8)
                  print("Blended provider", base, quote, primary.status_code,
                        (primary.json().get("date") if primary.ok else "unavailable"), flush=True)
                  ecb = session.get("https://api.frankfurter.dev/v1/latest",
                                    params={"base": base, "symbols": quote}, timeout=8)
                  print("ECB provider", base, quote, ecb.status_code,
                        (ecb.json().get("date") if ecb.ok else "unavailable"), flush=True)
                  amount = FXRateService().convert(1500, base, quote)
                  print("Selected rate", amount["provider"], amount["rate_date"],
                        amount["total_home"], flush=True)
                  assert amount["total_home"] > 0
                  assert amount["provider"].startswith("frankfurter-")
          finally:
              session.close()
          PY
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build -t travel-qr-cost-estimator:ci .
      - name: Start container and smoke test API
        run: |
          docker run -d --rm --name travel-qr-ci -p 127.0.0.1:8765:8000 -e QR_API_KEY="local-ci-key-with-at-least-24-characters" travel-qr-cost-estimator:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS http://127.0.0.1:8765/ | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"qr_payload":"upi://pay?pa=merchant@upi&am=100&cu=INR"}' http://127.0.0.1:8765/api/scan-text)
          test "$code" = 401
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"qr_payload":"QR:IN:INR:100"}' http://127.0.0.1:8765/api/scan-text | python -c 'import json,sys; v=json.load(sys.stdin); assert v["fx_result"]["total_home"]==100, v'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8765/ | grep -qi '^content-security-policy:'
          curl -fsS -X POST -H 'Content-Type: application/json' -H 'X-API-Key: local-ci-key-with-at-least-24-characters' -d '{"qr_payload":"upi://pay?pa=merchant@upi&am=100&cu=INR"}' http://127.0.0.1:8765/api/scan-text | python -c 'import json,sys; v=json.load(sys.stdin); assert v["success"] and v["fx_result"]["total_home"]==100, v'
      - if: always()
        run: docker logs travel-qr-ci || true
  load_local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-api.txt
      - name: Start local test server (USD same-currency, synthetic inputs)
        env:
          HOME_CURRENCY: USD
          QR_API_KEY: "ci-local-load-key-with-at-least-24-characters"
        run: |
          python -m uvicorn src.api.server:app --host 127.0.0.1 --port 8766 > /tmp/qr-local-load.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qr-local-load.log
          exit 1
      - name: Run bounded localhost concurrency smoke benchmark
        env:
          QR_API_KEY: "ci-local-load-key-with-at-least-24-characters"
          QR_LOAD_BASE: http://127.0.0.1:8766
        run: python integration/load_smoke.py
      - name: Show server logs if failed
        if: failure()
        run: tail -n 100 /tmp/qr-local-load.log

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [python, react, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend and browser dependencies
        run: |
          python -m pip install -r requirements-api.txt "playwright==1.56.0" "qrcode==8.2"
          python -m playwright install --with-deps chromium
          npm ci --prefix web
          npm run --prefix web build
      - name: Start combined frontend and API on one port
        env:
          QR_API_KEY: "local-ci-browser-key-at-least-24-characters"
          QR_DATABASE_URL: "sqlite:////tmp/qr-browser-ci-accounts.sqlite"
          QR_ALLOW_REGISTRATION: "true"
        run: |
          python -m uvicorn src.api.server:app --host 127.0.0.1 --port 8000 > /tmp/qr-backend.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'; then exit 0; fi
            sleep 2
          done
          cat /tmp/qr-backend.log
          exit 1
      - name: Exercise real browser interactions
        env:
          QR_API_KEY: "local-ci-browser-key-at-least-24-characters"
          QR_BROWSER_URL: "http://127.0.0.1:8000"
        run: python integration/browser_smoke.py
      - name: Show backend/frontend logs when troubleshooting
        if: always()
        run: |
          tail -n 100 /tmp/qr-backend.log 2>/dev/null || true
