name: Repair npm lockfile

on:
  push:
    branches:
      - fix/qr-agent-safety-and-correctness-20261023

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Upgrade vulnerable transitive dependencies within declared semver ranges
        working-directory: web
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Require no high or critical advisories
        working-directory: web
        run: npm audit --audit-level=high
      - name: Reinstall and validate UI
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run lint
      - name: Commit repaired lockfile to the existing repair branch
        run: |
          if git diff --quiet -- web/package-lock.json; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore: refresh vulnerable frontend transitive dependency lockfile"
          git push origin HEAD:fix/qr-agent-safety-and-correctness-20261023
