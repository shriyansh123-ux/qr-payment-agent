name: Refresh npm lockfile for Step 3

on:
  push:
    branches: [deploy/single-service-render-20261024]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve vulnerable transitive versions in the lockfile
        working-directory: web
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=low
          npm ci
          npm run build
          npm run lint
      - name: Commit lockfile if it changed
        run: |
          if git diff --quiet -- web/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          git commit -m "chore: update vulnerable frontend lockfile packages"
          git push origin HEAD:deploy/single-service-render-20261024
