[project]
name = "travel-qr-cost-estimator"
version = "1.1.0"
description = "Travel cost helper: read payment QRs, see dated reference FX conversions, explore fees and check cash change."
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI uses calls such as File(...) and Header() in defaults.

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.per-file-ignores]
# Long synthetic payloads and non-Latin numerals are intentional test data.
"tests/*" = ["E501"]
"integration/*" = ["E501", "RUF001", "I001"]
